name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Regenerates every page and fails if a local link (image, PDF, CSS, JS)
      # points at a file that is not there.
      - name: Build the site
        run: node build.mjs

      # The generated pages are committed, so they must match the sources.
      # If this fails: run `node build.mjs` locally and commit the result.
      - name: Check the committed pages are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files differ from the sources. Run 'node build.mjs' and commit."
            git status --short
            git diff --stat
            exit 1
          fi
          echo "Generated pages match the sources."
